<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="style.css">
    <title>Weather App</title>
</head>
<body>

    <div class="container">
<div class="header">
    <div class="search-box">
        <input type="text"placeholder="Enter your location" class="input-box">
<button type="submit"id="searchBtn">🔍</button>

    </div>
</div> 
<!-- <div class="location-not-found">
    <h1>sry location not found!!</h1>
    <img src ="/images/error.png" alt="error">
</div> -->
<div class="weather-body">
    <img src="/images/cloudy.jpg"alt="Weather Image" class="weather-img">
    <div class="weather-box">
        <p class="Temperature">0℃</p>
        <p class="Description">cloudy</p>
    </div>
    <div class="weather details">
        <div class="humidity">
            <i class="fa-solid fa-droplet"></i>
            
            <div class="text">
                <span id="humidity">45%</span>
                <p>Humidity</p>
            </div>
        </div>
        <div class="wind">
            <i class="fa-solid fa-wind"></i>
                 <div class="text">
                    <span id="wind-speed">12km/H</span>


                    <p>Wind speed</p>
                 </div>

    </div>
</div>   
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/0400a9d6fa.js" crossorigin="anonymous"></script>
</body>

</html>
